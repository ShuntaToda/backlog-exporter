name: commit-messages
on:
  pull_request:

permissions:
  contents: read

jobs:
  # lefthook の commit-msg と同じ決まり（1 行・AI の署名なし）を、PR のコミットにかける（--no-verify や GitHub の画面で作ったコミットも見る）
  commit-messages:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-commit-message.mjs --range "${BASE_SHA}..${HEAD_SHA}"
