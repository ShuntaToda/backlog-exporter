<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">
  <title>backlog-exporter の OAuth ログインの全体像</title>
  <defs>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>
  <rect width="960" height="580" fill="#ffffff"/>

  <!-- 利用者のPC -->
  <rect x="20" y="20" width="400" height="540" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="40" y="50" font-size="17" font-weight="700" fill="#0f172a">利用者のPC</text>

  <rect x="80" y="70" width="320" height="140" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="100" y="100" font-size="16" font-weight="700" fill="#0f172a">backlog-exporter</text>
  <text x="100" y="124" font-size="12.5" fill="#475569">login / all / issue / wiki / update …</text>
  <rect x="100" y="142" width="280" height="52" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-dasharray="5 4"/>
  <text x="240" y="164" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">認可コードの受け取り口</text>
  <text x="240" y="183" font-size="12" fill="#475569" text-anchor="middle">localhost:5033/callback（login 中だけ開く）</text>

  <rect x="80" y="300" width="320" height="70" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="240" y="330" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">ブラウザ</text>
  <text x="240" y="352" font-size="12.5" fill="#475569" text-anchor="middle">いつも Backlog にログインしているもの</text>

  <rect x="80" y="430" width="320" height="110" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="96" y="454" font-size="13" font-weight="700" fill="#0f172a">~/.config/backlog-exporter/oauth/</text>
  <text x="96" y="472" font-size="13" font-weight="700" fill="#0f172a">  &lt;スペース&gt;.json（権限 600）</text>
  <text x="96" y="496" font-size="12" fill="#475569">アクセストークン（1時間）・リフレッシュトークン</text>
  <text x="96" y="514" font-size="12" fill="#475569">・Client ID / Secret</text>
  <text x="96" y="532" font-size="12" fill="#475569">出力先の backlog-settings.json には書かない</text>

  <!-- Backlog -->
  <rect x="560" y="20" width="380" height="370" rx="14" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="580" y="50" font-size="17" font-weight="700" fill="#0f172a">Backlog スペース</text>

  <rect x="600" y="70" width="320" height="64" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="760" y="98" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Backlog API</text>
  <text x="760" y="119" font-size="12" fill="#475569" text-anchor="middle">課題・Wiki・ドキュメント</text>

  <rect x="600" y="160" width="320" height="64" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="760" y="188" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">トークンの発行・更新</text>
  <text x="760" y="209" font-size="12" fill="#475569" text-anchor="middle">POST /api/v2/oauth2/token</text>

  <rect x="600" y="300" width="320" height="70" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="760" y="330" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">許可画面</text>
  <text x="760" y="352" font-size="12" fill="#475569" text-anchor="middle">Backlog が本人にアクセスの許可を確認する</text>

  <!-- Developer site -->
  <rect x="560" y="430" width="380" height="110" rx="14" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="580" y="458" font-size="15" font-weight="700" fill="#0f172a">⓪ Backlog Developer サイト（初回だけ）</text>
  <text x="580" y="482" font-size="12.5" fill="#475569">自分でアプリを登録し、Client ID / Secret をもらう</text>
  <text x="580" y="502" font-size="12.5" fill="#475569">Redirect URI：http://localhost:5033/callback</text>
  <text x="580" y="522" font-size="12.5" fill="#475569">スペース管理者でなくても登録できる</text>

  <!-- ① exporter -> browser -->
  <line x1="160" y1="210" x2="160" y2="296" stroke="#2563eb" stroke-width="2" marker-end="url(#blue)"/>
  <text x="168" y="250" font-size="12.5" fill="#2563eb">① 許可画面を</text>
  <text x="168" y="268" font-size="12.5" fill="#2563eb">開く</text>

  <!-- ② browser -> 許可画面 -->
  <line x1="400" y1="318" x2="596" y2="318" stroke="#2563eb" stroke-width="2" marker-end="url(#blue)"/>
  <text x="490" y="308" font-size="12.5" fill="#2563eb" text-anchor="middle">② 本人が「許可」</text>

  <!-- ③ 許可画面 -> browser -> 受け取り口 -->
  <line x1="600" y1="352" x2="404" y2="352" stroke="#2563eb" stroke-width="2" marker-end="url(#blue)"/>
  <text x="490" y="374" font-size="12.5" fill="#2563eb" text-anchor="middle">③ 認可コード付きで戻る</text>
  <line x1="320" y1="300" x2="320" y2="198" stroke="#2563eb" stroke-width="2" marker-end="url(#blue)"/>
  <text x="328" y="250" font-size="12.5" fill="#2563eb">③</text>

  <!-- ④ exporter -> token -->
  <line x1="400" y1="192" x2="596" y2="192" stroke="#2563eb" stroke-width="2" marker-end="url(#blue)"/>
  <text x="490" y="182" font-size="12.5" fill="#2563eb" text-anchor="middle">④ コード → トークン</text>
  <text x="490" y="212" font-size="11.5" fill="#2563eb" text-anchor="middle">（切れたら更新もここ）</text>

  <!-- ⑤⑥ exporter <-> file -->
  <line x1="50" y1="140" x2="50" y2="482" stroke="#b45309" stroke-width="2" marker-start="url(#amber)" marker-end="url(#amber)"/>
  <line x1="50" y1="140" x2="76" y2="140" stroke="#b45309" stroke-width="2"/>
  <line x1="50" y1="482" x2="76" y2="482" stroke="#b45309" stroke-width="2"/>
  <text x="58" y="400" font-size="12.5" fill="#b45309">⑤ 保存</text>
  <text x="58" y="418" font-size="12.5" fill="#b45309">⑥ 次回から読む</text>

  <!-- ⑦ exporter -> API -->
  <line x1="400" y1="102" x2="596" y2="102" stroke="#059669" stroke-width="2.5" marker-end="url(#green)"/>
  <text x="490" y="92" font-size="12.5" fill="#059669" text-anchor="middle">⑦ Bearer で取得</text>
  <text x="490" y="122" font-size="11.5" fill="#059669" text-anchor="middle">（API キーは送らない）</text>
</svg>
